kind = "web"
previewPath = "/"
title = "FlyRank Backend Assignment 2"
description = "An independent backend assignment project for a SQLite-persisted FastAPI task API with automated CRUD and restart persistence tests."
version = "1.0.0"
id = "artifacts/web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22333

[services.development]
run = "uv run uvicorn flyrank_assignment_2.app.main:app --app-dir ../.. --host 0.0.0.0 --port $PORT"

[services.production]
build = [ "pnpm", "--filter", "@workspace/web", "run", "build" ]
serve = "static"
publicDir = "artifacts/web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22333"
BASE_PATH = "/"
