name: Assignment 2 Persistence Evidence

on:
  push:
    branches: [final/a2-submission-audit]
    paths:
      - ".github/workflows/a2-evidence.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project and DB Browser
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          sudo apt-get update
          sudo apt-get install -y sqlitebrowser xvfb scrot xdotool sqlite3

      - name: Run automated suite
        run: python -m pytest -q

      - name: Prove persistence across two server processes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs .a2-evidence
          DB="$PWD/.a2-evidence/tasks.sqlite3"
          rm -f "$DB" "$DB-wal" "$DB-shm"
          export TASK_DATABASE_PATH="$DB"

          start_api() {
            python -m uvicorn app.main:app --app-dir flyrank_assignment_2 --host 127.0.0.1 --port 8002 > /tmp/a2-api.log 2>&1 &
            API_PID=$!
            for i in {1..80}; do
              if curl -fsS http://127.0.0.1:8002/health >/dev/null 2>&1; then return 0; fi
              sleep 0.1
            done
            cat /tmp/a2-api.log
            return 1
          }

          start_api
          INITIAL_COUNT=$(curl -fsS http://127.0.0.1:8002/tasks | python -c 'import json,sys; print(len(json.load(sys.stdin)))')
          test "$INITIAL_COUNT" = "3"

          curl -fsS -H 'Content-Type: application/json' \
            -d '{"title":"Persist across restart"}' \
            http://127.0.0.1:8002/tasks > /tmp/a2-created.json
          TASK_ID=$(python -c "import json; print(json.load(open('/tmp/a2-created.json'))['id'])")

          curl -fsS -X PUT -H 'Content-Type: application/json' \
            -d '{"title":"Persisted and updated","done":true}' \
            http://127.0.0.1:8002/tasks/$TASK_ID > /tmp/a2-updated.json

          kill "$API_PID"
          wait "$API_PID" 2>/dev/null || true

          start_api
          curl -fsS http://127.0.0.1:8002/tasks/$TASK_ID > /tmp/a2-after-restart.json
          AFTER_COUNT=$(curl -fsS http://127.0.0.1:8002/tasks | python -c 'import json,sys; print(len(json.load(sys.stdin)))')
          test "$AFTER_COUNT" = "4"

          python - <<'PY'
          import json
          row = json.load(open('/tmp/a2-after-restart.json'))
          assert row['title'] == 'Persisted and updated'
          assert row['done'] is True
          print('A2_RESTART_PERSISTENCE=PASS')
          PY

          kill "$API_PID"
          wait "$API_PID" 2>/dev/null || true

          {
            echo 'Assignment 2 persistence checkpoint'
            echo 'Initial seeded row count: 3'
            echo "Created/updated task id: $TASK_ID"
            echo 'Server process stopped and a new Uvicorn process started with the same SQLite file.'
            echo 'Row count after restart: 4'
            echo 'Persisted row after restart:'
            cat /tmp/a2-after-restart.json
            echo
            echo 'Result: PASS'
          } > docs/persistence-check.txt

          {
            echo 'SQL executed directly against the verification SQLite database:'
            echo 'SELECT id, title, done FROM tasks ORDER BY id;'
            echo
            sqlite3 -header -column "$DB" 'SELECT id, title, done FROM tasks ORDER BY id;'
          } > docs/sql-query.txt

          grep -q 'Persisted and updated' docs/sql-query.txt
          test "$(sqlite3 "$DB" 'SELECT COUNT(*) FROM tasks;')" = "4"
          echo 'A2_DIRECT_SQL_GATE=PASS'

      - name: Capture DB Browser for SQLite screenshot
        shell: bash
        run: |
          set -euo pipefail
          DB="$PWD/.a2-evidence/tasks.sqlite3"
          Xvfb :99 -screen 0 1440x1000x24 > /tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          export DISPLAY=:99
          sleep 1
          sqlitebrowser -t tasks "$DB" > /tmp/sqlitebrowser.log 2>&1 &
          BROWSER_PID=$!

          for i in {1..40}; do
            WINDOW=$(xdotool search --name 'DB Browser for SQLite' 2>/dev/null | head -n1 || true)
            if [ -n "$WINDOW" ]; then break; fi
            sleep 0.25
          done
          test -n "${WINDOW:-}"
          xdotool windowsize "$WINDOW" 1380 920 || true
          xdotool windowmove "$WINDOW" 20 20 || true
          sleep 2
          scrot docs/db-browser.png
          test -s docs/db-browser.png
          test "$(stat -c%s docs/db-browser.png)" -gt 10000
          kill "$BROWSER_PID" "$XVFB_PID" 2>/dev/null || true
          echo 'A2_DB_BROWSER_SCREENSHOT=PASS'

      - name: Upload executed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assignment-2-sqlite-evidence
          path: |
            docs/persistence-check.txt
            docs/sql-query.txt
            docs/db-browser.png
            /tmp/a2-api.log
            /tmp/sqlitebrowser.log
          if-no-files-found: warn

      - name: Commit executed evidence on audit branch push
        if: github.event_name == 'push' && github.ref == 'refs/heads/final/a2-submission-audit'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/persistence-check.txt docs/sql-query.txt docs/db-browser.png
          if git diff --cached --quiet; then
            echo 'No evidence changes to commit'
          else
            git commit -m 'Evidence: verify SQLite persistence and DB Browser inspection'
            git push
          fi
