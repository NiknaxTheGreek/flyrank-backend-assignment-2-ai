[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flyrank-backend-assignment-2"
version = "0.1.0"
description = "A FastAPI task CRUD service with SQLite persistence."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "uvicorn>=0.52.4",
]

[tool.setuptools.packages.find]
include = ["flyrank_assignment_2*"]
exclude = ["artifacts*"]

[tool.pytest.ini_options]
testpaths = ["flyrank_assignment_2/tests"]
pythonpath = ["."]
addopts = "-q"
